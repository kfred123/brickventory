services:
  postgres:
    image: postgres:16-alpine
    container_name: brick-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: brickdb
      POSTGRES_USER: brickuser
      POSTGRES_PASSWORD: brickpassword
    volumes:
      - brick-postgres-data:/var/lib/postgresql/data

volumes:
  brick-postgres-data:
