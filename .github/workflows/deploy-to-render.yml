name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'brick-server/**'
      - '.github/workflows/deploy-to-render.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        working-directory: ./brick-server
        run: mvn clean package -DskipTests
      
      - name: Run tests
        working-directory: ./brick-server
        run: mvn test
      
      - name: Ensure SPRING_DATASOURCE_URL is set on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "⚠️  RENDER_API_KEY or RENDER_SERVICE_ID not set in GitHub Secrets. Skipping Render env var update."
          else
            # Use the DATABASE_URL secret if available; otherwise Render will use its stored DATABASE_URL
            SPRING_URL="jdbc:${DATABASE_URL:-}"
            echo "Updating Render service env var SPRING_DATASOURCE_URL to '${SPRING_URL}' (empty value allowed if DATABASE_URL not provided as a secret)."
            curl -s -X PATCH "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -d "{\"envVars\":[{\"key\":\"SPRING_DATASOURCE_URL\",\"value\":\"${SPRING_URL}\",\"secure\":false}]}" \
              -w "\nHTTP Status: %{http_code}\n"
          fi

      - name: Trigger Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "⚠️  RENDER_API_KEY not set in GitHub Secrets. Skipping deployment."
            echo "Please configure GitHub Secrets before deployment."
            exit 0
          fi
          
          # Trigger deployment via Render's deploy hook if available
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment via deploy hook..."
            curl -X POST "$RENDER_DEPLOY_HOOK" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": false}' \
              -w "\nHTTP Status: %{http_code}\n"
          else
            echo "⚠️  RENDER_DEPLOY_HOOK not configured. Using manual deployment steps instead."
            echo "To enable automatic deployments, configure RENDER_DEPLOY_HOOK in GitHub Secrets."
            exit 0
          fi
      
      - name: Wait for Render to stabilize
        if: success()
        run: |
          echo "Waiting 30 seconds for Render deployment to stabilize..."
          sleep 30
      
      - name: Health check
        if: success()
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "⚠️  RENDER_URL not set in GitHub Secrets. Skipping health check."
            exit 0
          fi
          
          echo "Checking health of $RENDER_URL..."
          
          # Retry logic: try up to 5 times with 10 second intervals
          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "Attempt $i of $RETRIES..."
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL/api/health" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed! API is responding."
              exit 0
            else
              echo "⚠️  Health check returned HTTP $HTTP_CODE. Retrying..."
              if [ $i -lt $RETRIES ]; then
                sleep 10
              fi
            fi
          done
          
          echo "❌ Health check failed after $RETRIES attempts."
          echo "Please check Render deployment logs and API status."
          exit 1
      
      - name: Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment to Render successful!"
            echo "API URL: ${{ secrets.RENDER_URL }}"
          else
            echo "❌ Deployment failed. Check logs above."
          fi
