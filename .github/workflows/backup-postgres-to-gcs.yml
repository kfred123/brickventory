name: Backup Render Postgres to GCS

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install PostgreSQL client and gzip
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client gzip

      - name: Create backup filename
        id: backupname
        run: |
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          FILE_NAME="brickventory-db-${TIMESTAMP}.dump.gz"
          echo "file=${FILE_NAME}" >> $GITHUB_OUTPUT

      - name: Dump PostgreSQL database (custom format) and gzip
        run: |
          set -o pipefail
          pg_dump -h "$PGHOST" -p "${PGPORT:-5432}" -U "$PGUSER" -d "$PGDATABASE" -Fc | gzip > "$GITHUB_WORKSPACE/${{ steps.backupname.outputs.file }}"
        env:
          PGPASSWORD: ${{ secrets.PGPASSWORD }}

      - name: Upload backup to GCS
        run: |
          gsutil cp "$GITHUB_WORKSPACE/${{ steps.backupname.outputs.file }}" "gs://${GCS_BUCKET}/${{ steps.backupname.outputs.file }}"

      - name: Cleanup local artifact
        run: |
          rm -f "$GITHUB_WORKSPACE/${{ steps.backupname.outputs.file }}"
